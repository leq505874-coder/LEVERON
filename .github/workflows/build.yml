name: Build LEVERON APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: unzip -q LEVERON-source.zip
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          build-root-directory: leveron-src
      - name: Build debug APK
        working-directory: leveron-src
        env:
          AUDD_API_KEY: ${{ secrets.AUDD_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LEVERON-debug
          path: leveron-src/app/build/outputs/apk/debug/app-debug.apk
