name: Build LEVERON APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: unzip leveron-src.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Write local.properties
        run: echo "AUDD_API_KEY=${{ secrets.AUDD_API_KEY }}" > leveron-src/local.properties

      - name: Build APK
        run: |
          cd leveron-src
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEVERON-debug
          path: leveron-src/app/build/outputs/apk/debug/app-debug.apk
